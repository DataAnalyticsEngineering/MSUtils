[project]
name = "MSUtils"
version = "0.1.0"
description = "Microstructure Utilities by Data Analytics in Engineering (DAE) group, University of Stuttgart"
authors = [{name = "Sanath Keshav", email = "keshav@mib.uni-stuttgart.de"}]

[dependencies]
python = ">=3.10,<3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["MSUtils"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
MSUtils = { path = ".", editable = true }

[tool.pixi.tasks.h52xdmf]
args = ["file", { arg = "extra", default = "" }]
cmd  = "cd \"$INIT_CWD\" && python -m MSUtils.general.h52xdmf {{ extra }} {{ file }}"

[tool.pixi.dependencies]
numpy = ">=2.4.3,<3"
h5py = ">=3.16.0,<4"
scipy = ">=1.17.1,<2"
matplotlib = ">=3.10.8,<4"
scikit-image = ">=0.26.0,<0.27"
lxml = ">=6.0.2,<7"
plotly = ">=6.6.0,<7"
sympy = ">=1.14.0,<2"
ipykernel = ">=7.2.0,<8"
pre-commit = ">=4.5.1,<5"
pyvista = ">=0.47.1,<0.48"
meshio = ">=5.3.5,<6"
nbformat = ">=5.10.4,<6"
pyrecest = "0.9.*"


[tool.pixi.environments]
default = {features = [], solve-group = "default"}
